<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 930" role="img" aria-labelledby="title desc"><title id="title">Flujo de búsqueda bibliográfica complementaria</title><desc id="desc">118 ocurrencias de repositorios,106 únicos,14 inspeccionados,5 textos completos evaluados y3 incluidos. Revisión completa pendiente; bases bibliográficas bloqueadas.</desc><rect width="900" height="930" fill="white"/><style>text{font-family:Arial,sans-serif;fill:#16364b}.h{font-size:21px;font-weight:bold}.b{font-size:18px}.s{font-size:15px}</style><text x="450" y="35" text-anchor="middle" class="h">Búsqueda complementaria ejecutada · 02/11/2026</text><text x="450" y="62" text-anchor="middle" class="s">GitHub acotado; no sustituye WoS, Scopus, IEEE Xplore o arXiv</text><rect x="120" y="92" width="660" height="108" rx="9" fill="#f0f6fa" stroke="#52758c"/><text x="450" y="120" text-anchor="middle" class="h">Identificación</text><text x="450" y="149" text-anchor="middle" class="b">118 ocurrencias de repositorios</text><text x="450" y="175" text-anchor="middle" class="s">10 consultas; 14 páginas recuperadas</text><path d="M450 200 v18" stroke="#466d85" stroke-width="2"/><path d="M445 212 l5 6 5-6" fill="none" stroke="#466d85" stroke-width="2"/><rect x="120" y="218" width="660" height="108" rx="9" fill="#f0f6fa" stroke="#52758c"/><text x="450" y="246" text-anchor="middle" class="h">Deduplicación</text><text x="450" y="275" text-anchor="middle" class="b">12 ocurrencias duplicadas retiradas</text><text x="450" y="301" text-anchor="middle" class="s">106 repositorios únicos</text><path d="M450 326 v18" stroke="#466d85" stroke-width="2"/><path d="M445 338 l5 6 5-6" fill="none" stroke="#466d85" stroke-width="2"/><rect x="120" y="344" width="660" height="108" rx="9" fill="#f0f6fa" stroke="#52758c"/><text x="450" y="372" text-anchor="middle" class="h">Cribado de metadatos</text><text x="450" y="401" text-anchor="middle" class="b">106 repositorios revisados</text><text x="450" y="427" text-anchor="middle" class="s">92 no llevados a inspección completa</text><path d="M450 452 v18" stroke="#466d85" stroke-width="2"/><path d="M445 464 l5 6 5-6" fill="none" stroke="#466d85" stroke-width="2"/><rect x="120" y="470" width="660" height="108" rx="9" fill="#f0f6fa" stroke="#52758c"/><text x="450" y="498" text-anchor="middle" class="h">Inspección de fuentes</text><text x="450" y="527" text-anchor="middle" class="b">14 repositorios inspeccionados</text><text x="450" y="553" text-anchor="middle" class="s">9 sin texto completo elegible disponible</text><path d="M450 578 v18" stroke="#466d85" stroke-width="2"/><path d="M445 590 l5 6 5-6" fill="none" stroke="#466d85" stroke-width="2"/><rect x="120" y="596" width="660" height="108" rx="9" fill="#f0f6fa" stroke="#52758c"/><text x="450" y="624" text-anchor="middle" class="h">Textos completos</text><text x="450" y="653" text-anchor="middle" class="b">5 evaluados; 2 excluidos</text><text x="450" y="679" text-anchor="middle" class="s">Proyecto de curso sin fecha; NASDAQ100</text><path d="M450 704 v18" stroke="#466d85" stroke-width="2"/><path d="M445 716 l5 6 5-6" fill="none" stroke="#466d85" stroke-width="2"/><rect x="120" y="722" width="660" height="108" rx="9" fill="#f0f6fa" stroke="#52758c"/><text x="450" y="750" text-anchor="middle" class="h">Extracción local</text><text x="450" y="779" text-anchor="middle" class="b">3 textos incluidos</text><text x="450" y="805" text-anchor="middle" class="s">Selección de tres modelos aún provisional</text><text x="450" y="898" text-anchor="middle" class="s">Contexto adicional separado: artículo IEEE con código; antecedente Huang con texto bloqueado.</text></svg>