<svg xmlns="http://www.w3.org/2000/svg" width="1050" height="740" viewBox="0 0 1050 740" role="img" aria-labelledby="title desc">
<title id="title">Recuperación documental adicional del estudio S8</title>
<desc id="desc">Diagrama de procedencia de un nuevo texto completo identificado, sin reemplazar los conteos históricos ni simular un flujo PRISMA exhaustivo.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="5" refY="3" orient="auto"><path d="M0,0 L0,6 L6,3 z" fill="#335a78"/></marker></defs>
<rect width="1050" height="740" fill="white"/>
<text x="525" y="37" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#123a58">Recuperación documental adicional — S8</text>
<rect x="75" y="65" width="900" height="84" rx="10" fill="#edf5fa" stroke="#335a78" stroke-width="1.5"/>
<text x="525" y="94" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#123a58">Pista bibliográfica secundaria</text>
<text x="525" y="124" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#17364b">Miura et al. (2019): título en catálogo de literatura; aún sin inclusión.</text>
<line x1="525" y1="151" x2="525" y2="171" stroke="#335a78" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="75" y="178" width="900" height="84" rx="10" fill="#edf5fa" stroke="#335a78" stroke-width="1.5"/>
<text x="525" y="207" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#123a58">Consulta focalizada y biblioteca académica</text>
<text x="525" y="237" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#17364b">«Artificial Neural Networks» + «Realized Volatility» → Anton21a/Thesis.</text>
<line x1="525" y1="264" x2="525" y2="284" stroke="#335a78" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="75" y="291" width="900" height="84" rx="10" fill="#edf5fa" stroke="#335a78" stroke-width="1.5"/>
<text x="525" y="320" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#123a58">Recuperación de un texto completo identificado</text>
<text x="525" y="350" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#17364b">Artificial Neural Networks.pdf → Springer / ISNN 2019, pp165–172; DOI impreso.</text>
<line x1="525" y1="377" x2="525" y2="397" stroke="#335a78" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="75" y="404" width="900" height="84" rx="10" fill="#edf5fa" stroke="#335a78" stroke-width="1.5"/>
<text x="525" y="433" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#123a58">Extracción verificable de comparadores y resultados</text>
<text x="525" y="463" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#17364b">MLP de cuatro capas; CNN de dos capas + Dense; LSTM; GRU. Tabla 1: valores y varianzas.</text>
<line x1="525" y1="490" x2="525" y2="510" stroke="#335a78" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="75" y="517" width="900" height="84" rx="10" fill="#edf5fa" stroke="#335a78" stroke-width="1.5"/>
<text x="525" y="546" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#123a58">Una incorporación al corte: estudio S8</text>
<text x="525" y="576" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#17364b">Corpus histórico de cinco + S8 = seis. CNN1D no queda expresamente verificada.</text>
<text x="525" y="653" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#17364b">El flujo histórico de118 ocurrencias / 106 repositorios / cinco textos incluidos se conserva intacto.</text>
<text x="525" y="680" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#17364b">Djanga 2025 aporta contexto y cita Aaltio 2022; no se inventa una cita Djanga → Miura.</text>
<text x="525" y="708" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#5b6670">Revisión focalizada posterior al benchmark; no acredita exhaustividad ni indexación.</text>
</svg>
