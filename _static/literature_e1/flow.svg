<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 1160" role="img" aria-labelledby="title desc">
<title id="title">Flujo acumulado de búsqueda complementaria y recuperación dirigida</title>
<desc id="desc">Consultas del 2 de noviembre de 2026: 118 ocurrencias, 12 repetidas y 106 repositorios. Al 3 de noviembre hay 20 repositorios inspeccionados, 86 sin inspección, siete textos evaluados, dos excluidos y cinco incluidos. Corpus exploratorio con tres documentos grises; no acredita consultas en bases académicas.</desc>
<rect width="1060" height="1160" fill="white"/>
<style>text{font-family:Arial,sans-serif;fill:#16364b}.h{font-size:21px;font-weight:bold}.b{font-size:19px}.s{font-size:16px}</style>
<text x="530" y="35" text-anchor="middle" class="h">Búsqueda complementaria y recuperación dirigida · corte 03/11/2026</text>
<text x="530" y="65" text-anchor="middle" class="s">Consultas históricas: 02/11 · seis repositorios ya identificados recuperados el 03/11</text>
<text x="530" y="93" text-anchor="middle" class="s">No sustituye WoS, Scopus, IEEE Xplore o arXiv; inclusión exploratoria con calidad separada</text>
<rect x="70" y="120" width="920" height="105" rx="9" fill="#f0f6fa" stroke="#52758c"/>
<text x="530" y="147" text-anchor="middle" class="h">Identificación · consultas del 02/11/2026</text>
<text x="530" y="178" text-anchor="middle" class="b">118 ocurrencias de repositorios</text>
<text x="530" y="205" text-anchor="middle" class="s">10 cadenas; 14 páginas recuperadas; sin nuevas cadenas el 03/11</text>
<path d="M530 225 v23" stroke="#466d85" stroke-width="2"/>
<path d="M525 242 l5 6 5-6" fill="none" stroke="#466d85" stroke-width="2"/>
<rect x="70" y="250" width="920" height="105" rx="9" fill="#f0f6fa" stroke="#52758c"/>
<text x="530" y="277" text-anchor="middle" class="h">Deduplicación de repositorios</text>
<text x="530" y="308" text-anchor="middle" class="b">12 ocurrencias repetidas retiradas</text>
<text x="530" y="335" text-anchor="middle" class="s">106 repositorios distintos; no son 106 artículos</text>
<path d="M530 355 v23" stroke="#466d85" stroke-width="2"/>
<path d="M525 372 l5 6 5-6" fill="none" stroke="#466d85" stroke-width="2"/>
<rect x="70" y="380" width="920" height="105" rx="9" fill="#f0f6fa" stroke="#52758c"/>
<text x="530" y="407" text-anchor="middle" class="h">Cribado de metadatos</text>
<text x="530" y="438" text-anchor="middle" class="b">106 registros revisados</text>
<text x="530" y="465" text-anchor="middle" class="s">Motivos históricos corregidos; no priorización no equivale a inelegibilidad</text>
<path d="M530 485 v23" stroke="#466d85" stroke-width="2"/>
<path d="M525 502 l5 6 5-6" fill="none" stroke="#466d85" stroke-width="2"/>
<rect x="70" y="510" width="920" height="105" rx="9" fill="#f0f6fa" stroke="#52758c"/>
<text x="530" y="537" text-anchor="middle" class="h">Inspección acumulada · corte 03/11/2026</text>
<text x="530" y="568" text-anchor="middle" class="b">20 repositorios inspeccionados = 14 previos + 6 nuevos</text>
<text x="530" y="595" text-anchor="middle" class="s">86 registros sin inspección; 11 candidatos de metadatos siguen pendientes</text>
<path d="M530 615 v23" stroke="#466d85" stroke-width="2"/>
<path d="M525 632 l5 6 5-6" fill="none" stroke="#466d85" stroke-width="2"/>
<rect x="70" y="640" width="920" height="105" rx="9" fill="#f0f6fa" stroke="#52758c"/>
<text x="530" y="667" text-anchor="middle" class="h">Evaluación documental</text>
<text x="530" y="698" text-anchor="middle" class="b">7 textos completos evaluados = 5 previos + 2 nuevos</text>
<text x="530" y="725" text-anchor="middle" class="s">No se cuentan README, código o diapositivas como artículos adicionales</text>
<path d="M530 745 v23" stroke="#466d85" stroke-width="2"/>
<path d="M525 762 l5 6 5-6" fill="none" stroke="#466d85" stroke-width="2"/>
<rect x="70" y="770" width="920" height="105" rx="9" fill="#f0f6fa" stroke="#52758c"/>
<text x="530" y="797" text-anchor="middle" class="h">Exclusión de textos completos</text>
<text x="530" y="828" text-anchor="middle" class="b">2 documentos excluidos</text>
<text x="530" y="855" text-anchor="middle" class="s">Identidad/fecha insuficientes y estudio de NASDAQ100; no exclusión por ser curso</text>
<path d="M530 875 v23" stroke="#466d85" stroke-width="2"/>
<path d="M525 892 l5 6 5-6" fill="none" stroke="#466d85" stroke-width="2"/>
<rect x="70" y="900" width="920" height="105" rx="9" fill="#f0f6fa" stroke="#52758c"/>
<text x="530" y="927" text-anchor="middle" class="h">Corpus exploratorio ampliado</text>
<text x="530" y="958" text-anchor="middle" class="b">5 textos incluidos = S1 + S2 + S5 + S6 + S7</text>
<text x="530" y="985" text-anchor="middle" class="s">3 documentos grises; S6 sin fecha de publicación acreditada; riesgos severos</text>
<text x="530" y="1045" text-anchor="middle" class="s">Sensibilidades: corpus previo S1/S2/S5; exclusión S6/S7; documentos con fecha acreditada.</text>
<text x="530" y="1075" text-anchor="middle" class="s">S3/S4 siguen como contexto sin texto completo; software inspeccionado no añade frecuencias.</text>
<text x="530" y="1105" text-anchor="middle" class="s">El corte histórico y las decisiones anteriores se conservan; ningún resultado de autores es experimento propio.</text>
</svg>
