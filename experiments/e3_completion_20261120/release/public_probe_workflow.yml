name: Read-only E3 public Render and DOI probe
on:
  push:
    branches: [main]
    paths:
      - 'experiments/e3_completion_20261120/release/public_probe.py'
      - '.github/workflows/verify-e3-public-release.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  observe-public-service:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout the probe source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Checkout immutable scientific and client references
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: bbd2604a9b78bab7fc8289ad07aae0a6117e884e
          path: frozen_reference
          persist-credentials: false
          sparse-checkout-cone-mode: true
          sparse-checkout: |
            experiments/e3_cierre_integral_20261118/acceptance
            experiments/e3_bloques_fg_20261117
            artifacts/e3_dashboard_v1
            artifacts/e3_serving_extensions_v2
            artifacts/e3_serving_calibration_v2
            data/e3_dashboard_v1
            experiments/e3_cierre_integral_20261118/serving/export_capabilities/tsmixer
      - name: Prepare CPU browser client only
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - name: Install fixed browser client without model runtime
        run: |
          python -m pip install playwright==1.56.0 greenlet==3.5.6 pyee==13.0.1
          python -m pip check
          python -m playwright install --with-deps chromium
      - name: Observe actual source identity and execute the frozen five-model client
        run: |
          python experiments/e3_completion_20261120/release/public_probe.py \
            --reference-root frozen_reference --output /tmp/e3-public-release \
            --wake-seconds 180
      - name: Retain public receipts even if the service or DOI cannot be verified
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: e3-public-release-${{ github.run_id }}
          path: /tmp/e3-public-release/
          retention-days: 90
          if-no-files-found: warn
