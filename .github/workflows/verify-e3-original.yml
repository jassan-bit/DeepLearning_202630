name: Verificar candidato neuronal de E3
on:
  push:
    branches: [main]
    paths:
      - 'src/original_model.py'
      - 'src/e3_development.py'
      - 'src/e3_innovation*.py'
      - 'tests/test_original_model.py'
      - 'tests/test_development_training.py'
      - 'tests/test_development_github.py'
      - 'tests/test_development_audit.py'
      - 'tests/test_innovation_design.py'
      - 'tests/test_innovation_*.py'
      - 'tests/test_moment_head.py'
      - 'scripts/e3_verify_original.py'
      - 'scripts/e3_run_development.py'
      - 'scripts/e3_github_storage.py'
      - 'scripts/e3_audit_development.py'
      - 'scripts/e3_audit_innovation.py'
      - 'scripts/e3_verify_moment_head.py'
      - 'scripts/e3_audit_moment_admissibility.py'
      - 'scripts/e3_verify_innovation_design.py'
      - 'scripts/e3_run_innovation.py'
      - 'scripts/e3_innovation_github.py'
      - 'experiments/e3_bloque_c_20261115/**'
      - 'experiments/e3_desarrollo_v1/**'
      - 'experiments/e3_revision_post_piloto_20261116/**'
      - 'experiments/e3_ficha_cnn_lstm_atencion_v2_20261116/**'
      - 'experiments/e3_innovacion_v2_20261116/**'
      - 'experiments/e3_cierre_v2_20261116/**'
      - 'experiments/e3_mecanismo_momentos_20261116/**'
      - 'experiments/e3_dictamen_momentos_20261116/**'
      - 'book_e3/_static/e3_cierre_v2_20261116/**'
      - 'book_e3/sections/20_cierre_v2.md'
      - 'book_e3/_static/e3_mecanismo_momentos_20261116/**'
      - 'book_e3/sections/21_propuesta_momentos.md'
      - 'book_e3/_static/e3_dictamen_momentos_20261116/**'
      - 'book_e3/sections/22_dictamen_momentos.md'
      - 'notebooks/entregable3_desarrollo_colab.ipynb'
      - 'notebooks/preparar_e3_desarrollo_runtime.py'
      - 'notebooks/run_e3_github_colab.py'
      - 'notebooks/entregable3_innovacion_v2_colab.ipynb'
      - 'notebooks/preparar_e3_innovacion_runtime.py'
      - 'requirements-e3-development-gpu.lock.txt'
      - 'requirements-e3-original-cpu.lock.txt'
      - 'requirements-e3-design-cpu.lock.txt'
      - 'requirements-e3-innovation-gpu.lock.txt'
      - 'requirements-e3-close-cpu.lock.txt'
      - '.github/workflows/verify-e3-original.yml'
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  original-software:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements-nas-cpu.lock.txt
            requirements-e3-original-cpu.lock.txt
            requirements-e3-design-cpu.lock.txt
            requirements-e3-close-cpu.lock.txt
      - name: Instalar dependencias CPU fijadas
        run: |
          python -m pip install -r requirements-e3-close-cpu.lock.txt
          python -m pip check
      - name: Verificar software y propiedad sobre datos artificiales
        env:
          OMP_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
        run: |
          python -m pytest tests/test_original_model.py tests/test_development_training.py tests/test_development_github.py tests/test_development_audit.py tests/test_innovation_design.py tests/test_innovation_model.py tests/test_innovation_training.py tests/test_innovation_github.py tests/test_innovation_notebook.py tests/test_innovation_audit.py tests/test_moment_head.py -q
          python scripts/e3_verify_original.py --check
          python scripts/e3_audit_development.py --check
          python scripts/e3_verify_innovation_design.py --check
          python scripts/e3_audit_innovation.py --check
          python scripts/e3_verify_moment_head.py --check
          python scripts/e3_audit_moment_admissibility.py --check
      - name: Comprobar copias de la propuesta por momentos en el libro
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path('experiments/e3_mecanismo_momentos_20261116')
          target = Path('book_e3/_static/e3_mecanismo_momentos_20261116')
          pairs = {'theory.md': 'theory.md', 'design_spec.json': 'design_spec.json',
                   'verification/metrics.json': 'metrics.json',
                   'verification/moment_envelope.svg': 'moment_envelope.svg'}
          for original, copy in pairs.items():
              assert (source / original).read_bytes() == (target / copy).read_bytes(), original
          print('Cuatro copias de la propuesta verificadas contra sus maestros')
          PY
      - name: Comprobar copias del dictamen en el libro
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path('experiments/e3_dictamen_momentos_20261116')
          target = Path('book_e3/_static/e3_dictamen_momentos_20261116')
          for name in ('counterexamples.json', 'decision.json', 'human_review.md', 'native_search_plan.csv'):
              assert (source / name).read_bytes() == (target / name).read_bytes(), name
          print('Cuatro copias del dictamen verificadas contra sus maestros')
          PY
      - name: Comprobar sintaxis de Colab sin instalar CUDA ni entrenar mercado
        run: |
          python -m py_compile notebooks/preparar_e3_desarrollo_runtime.py notebooks/run_e3_github_colab.py scripts/e3_github_storage.py scripts/e3_run_development.py src/e3_development.py
          python -m py_compile notebooks/preparar_e3_innovacion_runtime.py scripts/e3_run_innovation.py scripts/e3_innovation_github.py src/e3_innovation.py src/e3_innovation_model.py
          python - <<'PY'
          import json
          from pathlib import Path
          notebook = json.loads(Path('notebooks/entregable3_desarrollo_colab.ipynb').read_text())
          assert notebook['nbformat'] == 4
          code = '\n'.join(''.join(cell['source']) for cell in notebook['cells'] if cell['cell_type'] == 'code')
          assert 'drive.mount' not in code and 'from google.colab import drive' not in code
          for index, cell in enumerate(notebook['cells']):
              if cell['cell_type'] == 'code':
                  assert not cell.get('outputs'), 'El notebook debe publicarse sin resultados fabricados'
                  compile(''.join(cell['source']), f'colab-cell-{index}', 'exec')
          PY
