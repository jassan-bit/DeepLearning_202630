name: Verificar candidato neuronal de E3
on:
  push:
    branches: [main]
    paths:
      - 'src/original_model.py'
      - 'src/e3_development.py'
      - 'tests/test_original_model.py'
      - 'tests/test_development_training.py'
      - 'tests/test_development_github.py'
      - 'scripts/e3_verify_original.py'
      - 'scripts/e3_run_development.py'
      - 'scripts/e3_github_storage.py'
      - 'experiments/e3_bloque_c_20261115/**'
      - 'experiments/e3_desarrollo_v1/**'
      - 'notebooks/entregable3_desarrollo_colab.ipynb'
      - 'notebooks/preparar_e3_desarrollo_runtime.py'
      - 'notebooks/run_e3_github_colab.py'
      - 'requirements-e3-development-gpu.lock.txt'
      - 'requirements-e3-original-cpu.lock.txt'
      - '.github/workflows/verify-e3-original.yml'
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  original-software:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements-nas-cpu.lock.txt
            requirements-e3-original-cpu.lock.txt
      - name: Instalar dependencias CPU fijadas
        run: |
          python -m pip install -r requirements-e3-original-cpu.lock.txt
          python -m pip check
      - name: Verificar software y propiedad sobre datos artificiales
        env:
          OMP_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
        run: |
          python -m pytest tests/test_original_model.py tests/test_development_training.py tests/test_development_github.py -q
          python scripts/e3_verify_original.py --check
      - name: Comprobar sintaxis de Colab sin instalar CUDA ni entrenar mercado
        run: |
          python -m py_compile notebooks/preparar_e3_desarrollo_runtime.py notebooks/run_e3_github_colab.py scripts/e3_github_storage.py scripts/e3_run_development.py src/e3_development.py
          python - <<'PY'
          import json
          from pathlib import Path
          notebook = json.loads(Path('notebooks/entregable3_desarrollo_colab.ipynb').read_text())
          assert notebook['nbformat'] == 4
          code = '\n'.join(''.join(cell['source']) for cell in notebook['cells'] if cell['cell_type'] == 'code')
          assert 'drive.mount' not in code and 'from google.colab import drive' not in code
          for index, cell in enumerate(notebook['cells']):
              if cell['cell_type'] == 'code':
                  assert not cell.get('outputs'), 'El notebook debe publicarse sin resultados fabricados'
                  compile(''.join(cell['source']), f'colab-cell-{index}', 'exec')
          PY
