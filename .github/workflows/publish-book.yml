name: Publicar los tres Jupyter Books
on:
  push:
    branches: [main, e2-compute-20261109, e2-gpu-20261109]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      artifact-name: ${{ steps.artifact.outputs.name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Rechazar una fuente obsoleta
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/safe_publish_books.py check-source --source-commit "$GITHUB_SHA"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-book.lock.txt
      - name: Instalar dependencias y probar protecciones
        run: |
          set -euo pipefail
          python -m pip install -r requirements-book.lock.txt
          python -m pip check
          python tests/test_multi_book_publication.py
          python tests/test_safe_publish_books.py
          python tests/test_e2_guide_schedule.py
          python tests/test_e2_colab_diagnostics.py
          python tests/test_e2_session_supervisor.py
          python -m unittest discover -s tests -p test_e2_search_plan.py -v
          python -m unittest discover -s tests -p test_e2_required_catalogue.py -v
          python scripts/e2_search_plan.py --protocol book_e2/_static/search_protocol_20261109/protocol.json --k 40 --final-seeds 30
      - name: Construir y verificar los tres libros independientes
        run: |
          set -euo pipefail
          for book_dir in book book_e2 book_e3; do
            jupyter-book build "$book_dir" --all --warningiserror --keep-going
            python scripts/check_book_links.py --book-dir "$book_dir"
          done
      - name: Ensamblar e inventariar el sitio completo
        run: |
          set -euo pipefail
          python scripts/assemble_books_site.py --source-commit "$GITHUB_SHA"
          python scripts/safe_publish_books.py inventory --source-commit "$GITHUB_SHA"
      - name: Identificar el artefacto de este intento
        id: artifact
        run: echo "name=books-site-${GITHUB_SHA}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: _build/site/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
  nas-mechanisms:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-nas-cpu.lock.txt
      - name: Instalar entorno CPU de mecanismos NAS
        run: |
          python -m pip install -r requirements-nas-cpu.lock.txt
          python -m pip check
      - name: Verificar fábricas, mecanismos y enlace de HPO sin mercado
        run: |
          python -m unittest discover -s tests -p 'test_e2_nas_*.py' -v
  training-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements-nas-cpu.lock.txt
            requirements-e2-training-cpu.lock.txt
      - name: Instalar entorno CPU de selección y entrenamiento
        run: |
          python -m pip install -r requirements-e2-training-cpu.lock.txt
          python -m pip check
      - name: Recuperar ocho fuentes inmutables de iTransformer
        run: python scripts/fetch_e2_itransformer_sources.py --output work/author_sources/iTransformer
      - name: Verificar etapas, fechas, comparadores, checkpoints y supervisor
        env:
          E2_ITRANSFORMER_SOURCE_ROOT: ${{ github.workspace }}/work/author_sources/iTransformer
        run: |
          python scripts/prepare_e2_pilot_snapshot.py --root .
          python -m unittest discover -s tests -p 'test_prepare_e2_pilot_snapshot.py' -v
          python -m unittest discover -s tests -p 'test_e2_*training*.py' -v
          python -m unittest discover -s tests -p 'test_e2_development*.py' -v
          python -m unittest discover -s tests -p 'test_e2_pilot*.py' -v
          python -m unittest discover -s tests -p 'test_e2_reference_variance.py' -v
          python -m unittest discover -s tests -p 'test_e2_cpu*.py' -v
          python -m unittest discover -s tests -p 'test_e2_calibrated*.py' -v
          python -m unittest discover -s tests -p 'test_e2_optimized*.py' -v
          python -m unittest discover -s tests -p 'test_e2_calibration_report.py' -v
          python -m unittest discover -s tests -p 'test_e2_compute_evidence.py' -v
          python -m unittest discover -s tests -p 'test_e2_public_evidence.py' -v
          python -m unittest discover -s tests -p 'test_e2_cuda_models.py' -v
          python -m unittest discover -s tests -p 'test_e2_cuda_bindings.py' -v
          python -m unittest discover -s tests -p 'test_e2_search_session.py' -v
          python -m unittest discover -s tests -p 'test_e2_github_campaign.py' -v
          python -m unittest discover -s tests -p 'test_e2_github_git_transport.py' -v
          python -m unittest discover -s tests -p 'test_e2_cuda_search.py' -v
          python -m unittest discover -s tests -p 'test_e2_implementation_optimization.py' -v
          python -m unittest discover -s tests -p 'test_e2_implementation_optimization_v2.py' -v
          python -m unittest discover -s tests -p 'test_e2_optimized_budget_extension.py' -v
          python -m unittest discover -s tests -p 'test_e2_gpu*.py' -v
          python -m unittest discover -s tests -p 'test_fetch_e2_development_sources.py' -v
  publish:
    needs: [build, nas-mechanisms, training-integration]
    # Authorized activation after gh-pages protection and a verified backup.
    # Only the first attempt of a new main push publishes; reruns never publish.
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main' && github.run_attempt == 1
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 25
    concurrency:
      group: publish-book
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ needs.build.outputs.artifact-name }}
          path: _build/site/
      - name: Verificar y publicar sin reescribir la historia
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/safe_publish_books.py publish --source-commit "$GITHUB_SHA" \
            --execute --report publication-report.json
      - name: Confirmar la versión servida de los tres libros
        run: |
          python scripts/safe_publish_books.py verify-live --source-commit "$GITHUB_SHA" \
            --url "https://jassan-bit.github.io/DeepLearning_202630/" \
            --attempts 24 --interval 30 --report publication-report.json
      - name: Conservar informe de publicación
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: books-publication-${{ github.run_id }}-${{ github.run_attempt }}
          path: publication-report.json
          if-no-files-found: ignore
          retention-days: 90
