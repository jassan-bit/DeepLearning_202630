name: Publicar Jupyter Book
on:
  push:
    branches: [main]
    paths:
      - 'book/**'
      - 'scripts/check_book_links.py'
      - 'requirements-book.lock.txt'
      - '.github/workflows/publish-book.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: publish-book
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-book.lock.txt
      - name: Instalar y validar
        run: |
          python -m pip install -r requirements-book.lock.txt
          python -m pip check
          jupyter-book build book --all --warningiserror --keep-going
          python scripts/check_book_links.py
          touch book/_build/html/.nojekyll
      - name: Actualizar rama de Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          publish_dir=$(mktemp -d)
          cp -a book/_build/html/. "$publish_dir/"
          cd "$publish_dir"
          git init -b gh-pages
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .
          git commit -m "Publicar libro de ${GITHUB_SHA}"
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          auth_header=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth_header" push --force origin HEAD:gh-pages
