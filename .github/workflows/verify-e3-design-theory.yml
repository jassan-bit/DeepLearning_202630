name: Verificar cota condicional y bitácora de E3
on:
  push:
    branches: [main]
    paths:
      - 'experiments/e3_diseno_riguroso_20261117/**'
      - 'experiments/design_log.md'
      - 'book_e3/_static/e3_diseno_riguroso_20261117/**'
      - 'src/original_model.py'
      - 'src/e3_development.py'
      - 'src/e3_innovation_model.py'
      - 'requirements-nas-cpu.lock.txt'
      - '.github/workflows/verify-e3-design-theory.yml'
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  latent-head-theory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-nas-cpu.lock.txt
      - name: Instalar el entorno CPU fijado
        run: |
          python -m pip install -r requirements-nas-cpu.lock.txt
          python -m pip check
      - name: Verificar los maestros y sus copias publicadas
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path('experiments/e3_diseno_riguroso_20261117')
          target = Path('book_e3/_static/e3_diseno_riguroso_20261117')
          for name in ('design_log.md', 'design_inventory.csv', 'requirements_review.csv',
                       'theory_reference.md', 'verify_theory.py', 'theory_verification.json'):
              assert (source / name).read_bytes() == (target / name).read_bytes(), name
          PY
      - name: Reproducir la comprobación sintética sin datos de mercado
        env:
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python experiments/e3_diseno_riguroso_20261117/verify_theory.py --output /tmp/e3-theory-ci.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: e3-latent-head-theory-${{ github.sha }}
          path: /tmp/e3-theory-ci.json
          if-no-files-found: error
