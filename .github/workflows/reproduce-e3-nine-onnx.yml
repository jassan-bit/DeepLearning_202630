name: Verify and publish nine preserved ONNX exports
on:
  push:
    branches: [main]
    paths:
      - 'artifacts/e3_neural_exports_20261120/**'
      - '.github/workflows/reproduce-e3-nine-onnx.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify-preserved-exports:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          sparse-checkout: |
            artifacts/e3_neural_exports_20261120
            experiments/e3_completion_20261120/export_ci
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - name: Verify immutable parts, ZIP inventory and original nine ONNX hashes
        run: |
          python artifacts/e3_neural_exports_20261120/assemble.py --output /tmp/e3-public-exports
      - name: Install CPU inference-only dependencies
        run: |
          python -m pip install -r artifacts/e3_neural_exports_20261120/requirements-ort-parity.txt
          python -m pip check
          python -m pip freeze > /tmp/e3-onnx-pip-freeze.txt
      - name: Replay all 661 frozen predictions per graph without Torch or re-export
        run: |
          python artifacts/e3_neural_exports_20261120/verify_saved_predictions.py --artifacts /tmp/e3-public-exports --manifest artifacts/e3_neural_exports_20261120/manifest.json --workdir /tmp/e3-private-parity --output /tmp/e3-public-exports/frozen_parity_receipt.json
          python -c 'from pathlib import Path; print("E3_ONNX_PARITY_REPORT=" + Path("/tmp/e3-public-exports/frozen_parity_receipt.json").read_text().replace(chr(10), ""))'
      - name: Publish checked original bytes only and verify the public download hash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python experiments/e3_completion_20261120/export_ci/publish_exports.py --standard /tmp/e3-public-exports/standard --temporal /tmp/e3-public-exports/temporal --output /tmp/e3-export-release
      - name: Retain receipts and public outputs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: e3-preserved-onnx-${{ github.run_id }}
          path: |
            /tmp/e3-public-exports/
            /tmp/e3-export-release/
            /tmp/e3-onnx-pip-freeze.txt
          retention-days: 90
          if-no-files-found: warn
