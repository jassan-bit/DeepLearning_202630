name: Prepare nine frozen ONNX export references without publishing models
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-reference-preparation:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CUDA_VISIBLE_DEVICES: ''
      PYTHONOPTIMIZE: '0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          sparse-checkout: experiments/e3_completion_20261120/export_ci
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - name: Install fixed CPU preparation environment
        run: python -m pip install -r experiments/e3_completion_20261120/export_ci/requirements-cpu-ci.txt
      - name: Verify original public inputs and constructors only
        run: python experiments/e3_completion_20261120/export_ci/standard/ci_export_standard.py --workdir /tmp/e3-reference-preparation --output /tmp/unused --prepare-only
      - name: Explain the publication gate
        run: echo 'No model fitting, re-export or model upload. Original accepted derivative binaries remain local pending explicit approval.'
