name: Verificar auditoría ampliada E3 sin mercados
on:
  push:
    branches: [main]
    paths:
      - 'experiments/e3_evaluacion_ampliada_20261119/**'
      - 'notebooks/e3_evaluacion_ampliada_robustez_colab.ipynb'
      - '.github/workflows/verify-e3-extended-audit.yml'
  pull_request:
    branches: [main]
    paths:
      - 'experiments/e3_evaluacion_ampliada_20261119/**'
      - 'notebooks/e3_evaluacion_ampliada_robustez_colab.ipynb'
      - '.github/workflows/verify-e3-extended-audit.yml'
permissions:
  contents: read
jobs:
  admission-and-durability:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verificar admisión, preespecificación y reanudación con API simulada
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python -m unittest discover -s experiments/e3_evaluacion_ampliada_20261119/admission -p 'test_*.py' -v
          python -m unittest discover -s experiments/e3_evaluacion_ampliada_20261119/orchestration -p 'test_*.py' -v
  synthetic-fitting:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements-nas-cpu.lock.txt
            requirements-e2-training-cpu.lock.txt
      - name: Ejecutar ajustes y reanudación sólo con datos generados
        env:
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python -m pip install -r requirements-e2-training-cpu.lock.txt
          python -m pip check
          python -m unittest discover -s experiments/e3_evaluacion_ampliada_20261119/evaluation -p 'test_*.py' -v
  synthetic-analysis:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: deployment/science/requirements.lock.txt
      - name: Verificar análisis, perturbaciones y figuras con datos generados
        env:
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
          PYTHONDONTWRITEBYTECODE: '1'
          MPLBACKEND: Agg
        run: |
          python -m pip install -r deployment/science/requirements.lock.txt
          python -m pip check
          python -m unittest discover -s experiments/e3_evaluacion_ampliada_20261119/robustness -p 'test_*.py' -v
