name: E3 scoped archive construction and public DOI observation without training
on:
  create:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-documentary-DOI:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'create' && github.event.ref_type == 'branch' &&
       github.event.ref == 'e3-render-public-acceptance-integral-archive-8d03a73d-v1')
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout the accepted public GET verifier only
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: true
          sparse-checkout: |
            experiments/e3_zenodo_publication_20261120
      - name: Observe current record, final documentary ZIP, and public DOI
        run: python3 experiments/e3_zenodo_publication_20261120/verify_public_deposit.py /tmp/e3-current-documentary-DOI
      - name: Preserve only the public observation reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: e3-current-documentary-DOI-${{ github.run_id }}
          path: |
            /tmp/e3-current-documentary-DOI/verification.json
            /tmp/e3-current-documentary-DOI/public_record.json
          retention-days: 30
          if-no-files-found: warn
  archive-integrity-and-permitted-sources:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'create' && github.event.ref_type == 'branch' &&
       github.event.ref == 'e3-render-public-acceptance-integral-archive-8d03a73d-v1')
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - name: Checkout only the archive engine and independent reproduction kit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: true
          sparse-checkout: |
            experiments/e3_integral_resolution_20261120/archive
      - name: Checkout the immutable 43-chunk evidence index
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 8d03a73d529eb3f9b2e89992b4488cfeb88a99e6
          path: frozen_reference
          persist-credentials: false
          sparse-checkout-cone-mode: true
          sparse-checkout: |
            experiments/e3_completion_20261120/release/index
      - name: Prepare pinned Python for stdlib archive checks
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - name: Verify path, scope, checksum, and extraction guards without market/model execution
        run: python -m unittest discover -s experiments/e3_integral_resolution_20261120/archive -p test_integral_capsule.py -v
      - name: Record archive runtime without credentials or environment dump
        run: |
          mkdir -p /tmp/e3-integral/public
          python - <<'PY'
          import json,platform,sys,zlib
          from pathlib import Path
          data={'python':sys.version,'platform':platform.platform(),'zlib_compile':zlib.ZLIB_VERSION,'zlib_runtime':zlib.ZLIB_RUNTIME_VERSION,'models_executed':0}
          Path('/tmp/e3-integral/public/runtime.json').write_text(json.dumps(data,indent=2)+'\n')
          print(json.dumps(data))
          PY
      - name: Verify every indexed historical payload and construct the scoped archive
        run: |
          python experiments/e3_integral_resolution_20261120/archive/integral_capsule.py \
            --index-root frozen_reference/experiments/e3_completion_20261120/release/index \
            --output /tmp/e3-integral --hydrate --workers 6 \
            --max-network-bytes 7000000000 --max-source-bytes 3000000000 \
            --max-artifact-bytes 190000000
      - name: Preserve only the scoped archive and public integrity reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: e3-source-evidence-review-${{ github.run_id }}
          path: /tmp/e3-integral/public/
          retention-days: 30
          if-no-files-found: warn
