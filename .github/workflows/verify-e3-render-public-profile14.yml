name: Read-only Zenodo publication and exact documentary ZIP verification
on:
  create:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-zenodo-deposit:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'create' && github.event.ref_type == 'branch' &&
       github.event.ref == 'e3-render-public-acceptance-zenodo-24356217-v1')
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout only the documentary public verifier
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: true
          sparse-checkout: |
            experiments/e3_zenodo_publication_20261120
      - name: GET public record, download exact final ZIP, and resolve reserved DOI
        run: python3 experiments/e3_zenodo_publication_20261120/verify_public_deposit.py /tmp/e3-zenodo-publication
      - name: Preserve public verification even if a check fails
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: e3-zenodo-publication-${{ github.run_id }}
          path: /tmp/e3-zenodo-publication/
          retention-days: 90
          if-no-files-found: warn
