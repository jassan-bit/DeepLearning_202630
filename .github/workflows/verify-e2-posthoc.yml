name: Verificar suplementos E2 sin datos de mercado
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  posthoc-software:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements-nas-cpu.lock.txt
            requirements-e2-training-cpu.lock.txt
      - name: Instalar entorno CPU de verificación
        run: |
          python -m pip install -r requirements-e2-training-cpu.lock.txt
          python -m pip check
      - name: Verificar estadísticas, presupuestos y tres ablaciones artificiales
        env:
          PYTHONPATH: scripts
        run: |
          python -m unittest discover -s tests -p 'test_e2_*posthoc*.py' -v
          python -m unittest discover -s tests -p 'test_e2_f2a_s8_comparisons.py' -v
          python -m unittest discover -s tests -p 'test_e2_efficiency_evidence.py' -v
          python -m unittest discover -s tests -p 'test_e2_literature_closure.py' -v
          python -m unittest discover -s tests -p 'test_e2_native_transverse_colab.py' -v
