name: Verificar estadística retrospectiva E3

on:
  push:
    branches: [main]
    paths:
      - 'experiments/e3_estadistica_posterior_20261117/**'
      - '.github/workflows/verify-e3-statistics.yml'
  pull_request:
    branches: [main]
    paths:
      - 'experiments/e3_estadistica_posterior_20261117/**'
      - '.github/workflows/verify-e3-statistics.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Instalar versiones de ciencia y pruebas CPU
        run: |
          python -m pip install -r experiments/e3_estadistica_posterior_20261117/requirements.txt pytest==8.3.5
          python -m pip check
      - name: Verificar fuentes congeladas y métodos con datos artificiales
        working-directory: experiments/e3_estadistica_posterior_20261117
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
        run: |
          python -B -c "from inputs import download_inputs; download_inputs('data')"
          python -B -m pytest -q test_inputs.py test_analysis.py test_mcs.py
