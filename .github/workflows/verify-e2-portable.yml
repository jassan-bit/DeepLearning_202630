name: Verificar protecciones del ejecutor portátil E2
on:
  push:
    branches: [main]
    paths:
      - scripts/e2_portable_campaign.py
      - tests/test_e2_portable_campaign.py
      - .github/workflows/verify-e2-portable.yml
  pull_request:
    branches: [main]
    paths:
      - scripts/e2_portable_campaign.py
      - tests/test_e2_portable_campaign.py
      - .github/workflows/verify-e2-portable.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  portable-software:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verificar rutas, integridad, recibos y separación de ejecución
        run: python tests/test_e2_portable_campaign.py
