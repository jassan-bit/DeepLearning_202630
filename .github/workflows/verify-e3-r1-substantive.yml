name: Verify E3 V3 substantive R1 documentary review

on:
  push:
    branches: [main]
    paths:
      - 'experiments/e3_r1_substantive_20261120/**'
      - 'book_e3/_static/e3_r1_substantive_20261120/**'
      - '.github/workflows/verify-e3-r1-substantive.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integrity-and-existing-theory:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify documentary hashes, mirrors, preserved inputs and existing algebra
        run: python experiments/e3_r1_substantive_20261120/verify_packet.py
