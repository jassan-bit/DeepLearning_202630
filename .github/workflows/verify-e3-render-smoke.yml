name: Verificar cliente de humo E3 y despliegue público solicitado
on:
  push:
    branches: [main]
    paths:
      - 'experiments/e3_bloques_fg_20261117/smoke_render.py'
      - 'tests/test_render_smoke_contracts.py'
      - '.github/workflows/verify-e3-render-smoke.yml'
  pull_request:
    paths:
      - 'experiments/e3_bloques_fg_20261117/smoke_render.py'
      - 'tests/test_render_smoke_contracts.py'
      - '.github/workflows/verify-e3-render-smoke.yml'
  workflow_dispatch:
    inputs:
      dashboard_url:
        description: 'Origen HTTPS del servicio: https://nombre.onrender.com'
        required: true
        type: string
      deployment_commit:
        description: 'SHA de 40 caracteres declarado a partir del log de despliegue Render'
        required: true
        type: string
permissions:
  contents: read
jobs:
  client-contracts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - name: Verificar límites de URL, paridad y alcance del recibo sin red
        run: python -m unittest discover -s tests -p test_render_smoke_contracts.py -v
  public-smoke:
    if: github.event_name == 'workflow_dispatch'
    needs: client-contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - name: Instalar sólo el cliente de verificación fijado
        run: |
          python -m pip install -r requirements-dashboard-dev.lock.txt
          python -m pip check
          python -m playwright install --with-deps chromium
      - name: Visitar la URL real y probar los cuatro modelos habilitados
        env:
          E3_SMOKE_URL: ${{ inputs.dashboard_url }}
          E3_SMOKE_DEPLOYMENT_COMMIT: ${{ inputs.deployment_commit }}
        run: |
          python experiments/e3_bloques_fg_20261117/smoke_render.py \
            --url "$E3_SMOKE_URL" --deployment-commit "$E3_SMOKE_DEPLOYMENT_COMMIT" \
            --output /tmp/e3-public-smoke/report.json \
            --screenshots-dir /tmp/e3-public-smoke/captures
      - name: Conservar recibo y capturas incluso cuando falle el despliegue
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: e3-public-smoke-${{ github.run_id }}
          path: /tmp/e3-public-smoke/
          if-no-files-found: warn
