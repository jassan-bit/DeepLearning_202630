name: Verificar dashboard E3 sin entrenamiento
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  runtime-and-browser:
    # Playwright 1.56 provides Chromium for Ubuntu 24.04; ubuntu-latest can advance.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements-dashboard.lock.txt
            requirements-dashboard-dev.lock.txt
      - name: Instalar ejecución CPU y herramientas de prueba separadas
        run: |
          python -m pip install -r requirements-dashboard-dev.lock.txt
          python -m pip check
      - name: Verificar datos, contratos, caché y aplicación
        env:
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python -m pytest tests/test_e3_dashboard_data.py tests/test_e3_dashboard_inference.py tests/test_e3_dashboard_history.py tests/test_e3_dashboard_app.py -q
          python experiments/e3_dashboard_20261117/build_data.py --download --check
          python -m unittest discover -s experiments/e3_cierre_integral_20261118/serving -p 'test_verify_serving_v2.py' -v
          python experiments/e3_cierre_integral_20261118/serving/verify_serving_v2.py \
            --npz work/e3_dashboard_inputs/current_cohort_arrays.npz --download \
            --output /tmp/e3-serving-ci.json
      - name: Verificar admisión, guardado y cliente V2 sin red
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python -m unittest discover -s experiments/e3_cierre_integral_20261118/data -p 'test_*.py' -v
          python -m unittest discover -s experiments/e3_cierre_integral_20261118/orchestration -p 'test_*.py' -v
          python -m unittest discover -s experiments/e3_cierre_integral_20261118/acceptance -p 'test_*.py' -v
      - name: Instalar Chromium de pruebas
        run: python -m playwright install --with-deps chromium
      - name: Recorrer la aplicación real en escritorio y tablet
        env:
          E3_DASHBOARD_TEST_URL: http://127.0.0.1:8050
          E3_DASHBOARD_SCREENSHOT_DIR: /tmp/e3-dashboard-captures
          E3_DASHBOARD_BROWSER_REPORT: /tmp/e3-dashboard-browser-ci.json
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          gunicorn --bind 127.0.0.1:8050 --workers 1 --threads 1 --timeout 120 app:server > /tmp/e3-dashboard-server.log 2>&1 &
          e3_server_pid=$!
          trap 'kill "$e3_server_pid" 2>/dev/null || true' EXIT
          python - <<'PY'
          import time, urllib.request
          for attempt in range(40):
              try:
                  with urllib.request.urlopen('http://127.0.0.1:8050/healthz', timeout=2) as response:
                      assert response.status == 200
                  break
              except (OSError, AssertionError):
                  time.sleep(0.5)
          else:
              raise SystemExit('El dashboard no arrancó dentro del límite de prueba')
          PY
          # The unittest runner also writes the browser acceptance receipt.
          python tests/test_e3_dashboard_browser.py
      - name: Conservar evidencias de interfaz y paridad
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: e3-dashboard-${{ github.sha }}
          path: |
            /tmp/e3-serving-ci.json
            /tmp/e3-dashboard-browser-ci.json
            /tmp/e3-dashboard-captures/
            /tmp/e3-dashboard-server.log
          if-no-files-found: warn
  scientific-software:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements-nas-cpu.lock.txt
            requirements-e3-original-cpu.lock.txt
      - name: Verificar módulos científicos en su entorno CPU separado
        env:
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python -m pip install -r requirements-e3-original-cpu.lock.txt
          python -m pip check
          python -m pytest tests/test_original_model.py tests/test_innovation_model.py -q
          python -m pip install scipy==1.17.0
          python -m pip check
          python -m unittest discover -s experiments/e3_cierre_integral_20261118/mechanism -p 'test_*.py' -v
          python -m unittest discover -s experiments/e3_cierre_integral_20261118/campaign -p 'test_*.py' -v
