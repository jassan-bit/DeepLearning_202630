name: Verify V3 development pilot

on:
  push:
    branches: [main]
    paths:
      - "experiments/e3_v3_development_pilot_20261120/**"
      - "src/e3_development.py"
      - "src/e3_innovation_model.py"
      - "src/e3_overlap_model_v3.py"
      - "src/original_model.py"
      - "experiments/e3_evaluacion_ampliada_20261119/evaluation/phase.py"
      - ".github/workflows/verify-v3-development-pilot.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CPU verification dependencies
        run: |
          python -m pip install numpy==2.3.5
          python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Verify analytical review packet
        run: python book_e3/_static/e3_r1_close_20261120/verify_packet.py
      - name: Run synthetic model, checkpoint and Git storage checks
        env:
          OMP_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
        run: python -m unittest discover -s experiments/e3_v3_development_pilot_20261120 -p 'test_*.py' -v
