name: Verificar expediente de novedad R1

on:
  push:
    branches: [main]
    paths:
      - 'experiments/e3_r1_review_20261118/**'
      - 'notebooks/e3_r1_revision_bibliografica_colab.ipynb'
      - '.github/workflows/verify-e3-r1.yml'
  pull_request:
    branches: [main]
    paths:
      - 'experiments/e3_r1_review_20261118/**'
      - 'notebooks/e3_r1_revision_bibliografica_colab.ipynb'
      - '.github/workflows/verify-e3-r1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bibliographic-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - name: Verificar respuestas, integridad, reintentos y conservación de GitHub sin red
        run: python -B -m unittest discover -s experiments/e3_r1_review_20261118/search -p test_search.py -v
      - name: Verificar identidades escalares con números artificiales
        run: python -B experiments/e3_r1_review_20261118/mechanism/verify_scalar_relations.py
      - name: Comprobar expediente, manifiesto y ausencia de un concepto humano inventado
        run: python -B experiments/e3_r1_review_20261118/verify_packet.py
