title: "Bitcoin: pronóstico de volatilidad"
author: "Jassan Arteta"
copyright: "2026"
only_build_toc_files: true
execute:
  execute_notebooks: "off"
repository:
  url: https://github.com/jassan-bit/DeepLearning_202630
  branch: main
  path_to_book: book
html:
  use_repository_button: true
  use_issues_button: false
sphinx:
  config:
    language: es
    html_show_sphinx: false
    mathjax_path: https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-mml-chtml.js
parse:
  myst_enable_extensions:
    - dollarmath
    - amsmath
