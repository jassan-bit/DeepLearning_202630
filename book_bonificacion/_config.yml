title: Demostraciones de aprendizaje profundo
author: Jassan Alberto Arteta Chavarro
copyright: '2026'
language: es
only_build_toc_files: true
execute:
  execute_notebooks: 'off'
parse:
  myst_enable_extensions:
  - amsmath
  - dollarmath
  - colon_fence
  - deflist
  - html_image
html:
  use_repository_button: true
  use_issues_button: false
  use_edit_page_button: false
  extra_footer: Demostraciones y comprobaciones de aprendizaje profundo.
sphinx:
  config:
    language: es
    html_title: Demostraciones de aprendizaje profundo
    html_static_path:
    - assets
    html_css_files:
    - custom.css
    mathjax_path: https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-mml-chtml.js
    mathjax3_config:
      tex:
        tags: ams
    html_theme_options:
      show_navbar_depth: 2
      show_toc_level: 2
      navigation_with_keys: true
      use_download_button: true
      home_page_in_toc: true
    html_show_sourcelink: true
repository:
  url: https://github.com/jassan-bit/DeepLearning_202630
  branch: main
  path_to_book: book_bonificacion
