<svg xmlns="http://www.w3.org/2000/svg" width="760" height="460" viewBox="0 0 760 460" role="img" aria-labelledby="title desc"><title id="title">Flujo provisional de las exportaciones recibidas</title><desc id="desc">No es un flujo de selección final ni actualiza el denominador histórico de E1.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#2c5378"/></marker></defs><g font-family="Arial, sans-serif" fill="#17324b"><rect x="30" y="24" width="700" height="76" rx="10" fill="#edf3fa" stroke="#2c5378"/><text x="380" y="53" text-anchor="middle" font-size="19" font-weight="bold">Exportaciones recibidas</text><text x="380" y="78" text-anchor="middle" font-size="16">4 archivos · 244 ocurrencias</text><path d="M380 101 V129" stroke="#2c5378" stroke-width="2" marker-end="url(#arrow)"/><rect x="30" y="132" width="700" height="76" rx="10" fill="#edf3fa" stroke="#2c5378"/><text x="380" y="161" text-anchor="middle" font-size="19" font-weight="bold">Agrupación candidata</text><text x="380" y="186" text-anchor="middle" font-size="16">182 grupos provisionales · identidades pendientes</text><path d="M380 209 V237" stroke="#2c5378" stroke-width="2" marker-end="url(#arrow)"/><rect x="30" y="240" width="700" height="76" rx="10" fill="#edf3fa" stroke="#2c5378"/><text x="380" y="269" text-anchor="middle" font-size="19" font-weight="bold">Primera pasada de metadatos</text><text x="380" y="294" text-anchor="middle" font-size="16">Título/resumen · todas las decisiones por revisar</text><path d="M380 317 V345" stroke="#2c5378" stroke-width="2" marker-end="url(#arrow)"/><rect x="30" y="348" width="700" height="76" rx="10" fill="#edf3fa" stroke="#2c5378"/><text x="380" y="377" text-anchor="middle" font-size="19" font-weight="bold">Textos completos e inclusión</text><text x="380" y="402" text-anchor="middle" font-size="16">No determinados por este importador · N histórico = 7</text></g></svg>
