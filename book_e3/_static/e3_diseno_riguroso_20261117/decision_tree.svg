<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 700" role="img" aria-labelledby="title description"><title id="title">Regla condicional de topes R1, R2 y R3</title><desc id="description">Si falla R1 o R2, el tope es 3,0. Si R1 y R2 se acreditan y falla R3, el tope es 4,0. Si las tres se acreditan, el tope es 5,0, sujeto a la propiedad formal y los demás requisitos. No asigna nota al proyecto.</desc><defs><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#165b91" /></marker><marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a62525" /></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#176840" /></marker></defs><rect x="25" y="30" width="420" height="120" rx="8" fill="#edf5fd" stroke="#165b91" stroke-width="1.8" /><text x="235" y="60" fill="#172b3a" font-family="Arial, sans-serif" font-size="17" text-anchor="middle" font-weight="normal"><tspan x="235" dy="0">R1. ¿Novedad para el mismo problema,</tspan><tspan x="235" dy="23">con diferencia sustantiva de mecanismo,</tspan><tspan x="235" dy="23">pérdida o entrenamiento y atribución</tspan><tspan x="235" dy="23">de la fuente cuando corresponda?</tspan></text><path d="M 445 90 L 555 90" fill="none" stroke="#a62525" stroke-width="1.8" marker-end="url(#red)" /><text x="497" y="77" fill="#a62525" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" font-weight="bold"><tspan x="497" dy="0">No</tspan></text><rect x="25" y="210" width="420" height="120" rx="8" fill="#edf5fd" stroke="#165b91" stroke-width="1.8" /><text x="235" y="240" fill="#172b3a" font-family="Arial, sans-serif" font-size="17" text-anchor="middle" font-weight="normal"><tspan x="235" dy="0">R2. ¿El núcleo fue implementado</tspan><tspan x="235" dy="23">desde su formulación y puede ser</tspan><tspan x="235" dy="23">explicado y modificado por el autor,</tspan><tspan x="235" dy="23">con procedencia declarada?</tspan></text><path d="M 445 270 L 555 270" fill="none" stroke="#a62525" stroke-width="1.8" marker-end="url(#red)" /><text x="497" y="257" fill="#a62525" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" font-weight="bold"><tspan x="497" dy="0">No</tspan></text><rect x="25" y="390" width="420" height="120" rx="8" fill="#edf5fd" stroke="#165b91" stroke-width="1.8" /><text x="235" y="420" fill="#172b3a" font-family="Arial, sans-serif" font-size="17" text-anchor="middle" font-weight="normal"><tspan x="235" dy="0">R3. ¿Supera a cada rival de la familia</tspan><tspan x="235" dy="23">completa con significancia en las</tspan><tspan x="235" dy="23">pruebas exigidas y bajo el resto</tspan><tspan x="235" dy="23">del protocolo de evaluación?</tspan></text><path d="M 445 450 L 555 450" fill="none" stroke="#a62525" stroke-width="1.8" marker-end="url(#red)" /><text x="497" y="437" fill="#a62525" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" font-weight="bold"><tspan x="497" dy="0">No</tspan></text><path d="M 235 150 L 235 210" fill="none" stroke="#165b91" stroke-width="1.8" marker-end="url(#blue)" /><text x="258" y="184" fill="#165b91" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" font-weight="bold"><tspan x="258" dy="0">Sí</tspan></text><path d="M 235 330 L 235 390" fill="none" stroke="#165b91" stroke-width="1.8" marker-end="url(#blue)" /><text x="258" y="364" fill="#165b91" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" font-weight="bold"><tspan x="258" dy="0">Sí</tspan></text><rect x="560" y="30" width="195" height="120" rx="8" fill="#fceeee" stroke="#a62525" stroke-width="1.8" /><text x="657.5" y="64" fill="#a62525" font-family="Arial, sans-serif" font-size="25" text-anchor="middle" font-weight="bold"><tspan x="657.5" dy="0">Tope 3,0</tspan></text><text x="657.5" y="96" fill="#172b3a" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" font-weight="normal"><tspan x="657.5" dy="0">R1 no acreditada</tspan><tspan x="657.5" dy="23">por incumplimiento.</tspan></text><rect x="560" y="210" width="195" height="120" rx="8" fill="#fceeee" stroke="#a62525" stroke-width="1.8" /><text x="657.5" y="244" fill="#a62525" font-family="Arial, sans-serif" font-size="25" text-anchor="middle" font-weight="bold"><tspan x="657.5" dy="0">Tope 3,0</tspan></text><text x="657.5" y="276" fill="#172b3a" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" font-weight="normal"><tspan x="657.5" dy="0">R2 no acreditada</tspan><tspan x="657.5" dy="23">por incumplimiento.</tspan></text><rect x="560" y="390" width="195" height="120" rx="8" fill="#fff2df" stroke="#a65b0c" stroke-width="1.8" /><text x="657.5" y="424" fill="#a65b0c" font-family="Arial, sans-serif" font-size="25" text-anchor="middle" font-weight="bold"><tspan x="657.5" dy="0">Tope 4,0</tspan></text><text x="657.5" y="456" fill="#172b3a" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" font-weight="normal"><tspan x="657.5" dy="0">R1 y R2 acreditadas;</tspan><tspan x="657.5" dy="23">R3 no satisfecha.</tspan></text><path d="M 235 510 L 235 548 L 305 548 L 305 575" fill="none" stroke="#176840" stroke-width="1.8" marker-end="url(#green)" /><text x="258" y="538" fill="#176840" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" font-weight="bold"><tspan x="258" dy="0">Sí</tspan></text><rect x="165" y="580" width="280" height="92" rx="8" fill="#e8f4ec" stroke="#176840" stroke-width="1.8" /><text x="305" y="613" fill="#176840" font-family="Arial, sans-serif" font-size="25" text-anchor="middle" font-weight="bold"><tspan x="305" dy="0">Tope 5,0</tspan></text><text x="305" y="643" fill="#172b3a" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" font-weight="normal"><tspan x="305" dy="0">R1, R2 y R3 acreditadas.</tspan></text></svg>
