title: "Entregable 3 · Deep Learning"
author: "Jassan Arteta"
copyright: "2026"
only_build_toc_files: true
execute:
  execute_notebooks: "off"
repository:
  url: https://github.com/jassan-bit/DeepLearning_202630
  branch: main
  path_to_book: book_e3
html:
  use_repository_button: true
  use_issues_button: false
sphinx:
  config:
    language: es
    html_show_sphinx: false
    templates_path: ["_templates"]
    html_theme_options:
      primary_sidebar_end: ["book-credit.html"]
      footer_content_items: []
    mathjax_path: https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-mml-chtml.js
parse:
  myst_enable_extensions:
    - dollarmath
    - amsmath
